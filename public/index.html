<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Claims — Submit a Claim</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="icon">☕</span>
        Cafe Claims
      </div>
    </nav>

    <div class="container">
      <div class="card">
        <div class="card-title">📋 Submit an Expense Claim</div>

        <div id="submitAlert" style="display:none;"></div>
        <div id="submitSuccess" class="alert alert-success" style="display:none;">
          ✓ Claim submitted successfully!
        </div>

        <form id="claimForm" novalidate>
          <div class="form-group">
            <label for="claimant_name">Your Name *</label>
            <input
              type="text"
              id="claimant_name"
              placeholder="e.g. Maria"
              required
              maxlength="100"
            />
          </div>

          <div class="form-group">
            <label for="description">Item Description *</label>
            <input
              type="text"
              id="description"
              placeholder="e.g. Bags of ice from 7-Eleven"
              required
              maxlength="255"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount ($) *</label>
              <input
                type="number"
                id="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              />
            </div>
            <div class="form-group">
              <label for="claim_date">Date *</label>
              <input type="date" id="claim_date" required />
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" required>
              <option value="" disabled selected>Select a category…</option>
              <option value="groceries">🛒 Groceries</option>
              <option value="ice">🧊 Ice</option>
              <option value="other">📦 Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea
              id="notes"
              placeholder="Any extra details, receipt info, etc."
              maxlength="1000"
            ></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            Submit Claim
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('claim_date').value = new Date().toISOString().split('T')[0];

    document.getElementById('claimForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl   = document.getElementById('submitAlert');
      const successEl = document.getElementById('submitSuccess');
      alertEl.style.display   = 'none';
      successEl.style.display = 'none';

      const claimant_name = document.getElementById('claimant_name').value.trim();
      const description   = document.getElementById('description').value.trim();
      const amount        = document.getElementById('amount').value;
      const claim_date    = document.getElementById('claim_date').value;
      const category      = document.getElementById('category').value;
      const notes         = document.getElementById('notes').value.trim();

      if (!claimant_name) return showAlert('Please enter your name.');
      if (!description)   return showAlert('Please enter a description.');
      if (!amount || parseFloat(amount) <= 0) return showAlert('Please enter a valid amount.');
      if (!claim_date)    return showAlert('Please select a date.');
      if (!category)      return showAlert('Please select a category.');

      const btn = document.getElementById('submitBtn');
      btn.disabled    = true;
      btn.textContent = 'Submitting…';

      try {
        const res = await fetch('/api/claims', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claimant_name, description, amount: parseFloat(amount), claim_date, category, notes: notes || undefined })
        });
        const data = await res.json();
        if (!res.ok) return showAlert(data.error || 'Failed to submit claim.');

        document.getElementById('claimForm').reset();
        document.getElementById('claim_date').value = new Date().toISOString().split('T')[0];
        successEl.style.display = 'flex';
        setTimeout(() => { successEl.style.display = 'none'; }, 4000);
      } catch {
        showAlert('Network error. Please try again.');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Submit Claim';
      }
    });

    function showAlert(msg) {
      const el = document.getElementById('submitAlert');
      el.className     = 'alert alert-error';
      el.textContent   = '⚠ ' + msg;
      el.style.display = 'flex';
    }
  </script>
</body>
</html>
