<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafe Claims — My Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="icon">☕</span>
        Cafe Claims
      </div>
      <div class="navbar-right">
        <span class="navbar-user" id="navUser"></span>
        <button class="btn btn-ghost" id="logoutBtn">Sign Out</button>
      </div>
    </nav>

    <div class="container">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="submit">Submit Claim</button>
        <button class="tab-btn" data-tab="my-claims">My Claims</button>
      </div>

      <!-- Submit Claim Tab -->
      <div class="tab-panel active" id="tab-submit">
        <div class="card">
          <div class="card-title">📋 New Expense Claim</div>
          <div id="submitAlert" style="display:none;"></div>
          <div id="submitSuccess" class="alert alert-success" style="display:none;">
            ✓ Claim submitted successfully!
          </div>

          <form id="claimForm" novalidate>
            <div class="form-group">
              <label for="description">Item Description *</label>
              <input
                type="text"
                id="description"
                placeholder="e.g. Bags of ice from 7-Eleven"
                required
                maxlength="255"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="amount">Amount ($) *</label>
                <input
                  type="number"
                  id="amount"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>
              <div class="form-group">
                <label for="claim_date">Date *</label>
                <input
                  type="date"
                  id="claim_date"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="category">Category *</label>
              <select id="category" required>
                <option value="" disabled selected>Select a category…</option>
                <option value="groceries">🛒 Groceries</option>
                <option value="ice">🧊 Ice</option>
                <option value="other">📦 Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="notes">Notes (optional)</label>
              <textarea
                id="notes"
                placeholder="Any extra details, receipt info, etc."
                maxlength="1000"
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
              Submit Claim
            </button>
          </form>
        </div>
      </div>

      <!-- My Claims Tab -->
      <div class="tab-panel" id="tab-my-claims">
        <div class="page-header">
          <h2>My Claims</h2>
          <div class="filter-bar" style="margin-bottom:0;">
            <select id="statusFilter">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>

        <div id="claimsList">
          <div class="loading-text">
            <span class="spinner"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // ── Auth guard ──────────────────────────────────────────
    let currentUser = null;

    async function init() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) throw new Error('Not auth');
        const data = await res.json();
        if (!data.user) throw new Error('Not auth');
        currentUser = data.user;

        // Admins go to admin page
        if (currentUser.role === 'admin') {
          window.location.href = '/admin';
          return;
        }

        document.getElementById('navUser').textContent = currentUser.display_name;
        setupTabs();
        setDefaultDate();
        loadClaims();
      } catch {
        window.location.href = '/';
      }
    }

    init();

    // ── Logout ──────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    // ── Tabs ────────────────────────────────────────────────
    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
          if (btn.dataset.tab === 'my-claims') loadClaims();
        });
      });
    }

    // ── Set default date to today ───────────────────────────
    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('claim_date').value = today;
    }

    // ── Submit claim ────────────────────────────────────────
    document.getElementById('claimForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('submitAlert');
      const successEl = document.getElementById('submitSuccess');
      alertEl.style.display = 'none';
      successEl.style.display = 'none';

      const description = document.getElementById('description').value.trim();
      const amount      = document.getElementById('amount').value;
      const claim_date  = document.getElementById('claim_date').value;
      const category    = document.getElementById('category').value;
      const notes       = document.getElementById('notes').value.trim();

      if (!description) return showFormAlert('Please enter a description.');
      if (!amount || parseFloat(amount) <= 0) return showFormAlert('Please enter a valid amount.');
      if (!claim_date) return showFormAlert('Please select a date.');
      if (!category) return showFormAlert('Please select a category.');

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const res = await fetch('/api/claims', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description, amount: parseFloat(amount), claim_date, category, notes: notes || undefined })
        });
        const data = await res.json();
        if (!res.ok) return showFormAlert(data.error || 'Failed to submit claim.');

        // Reset form and show success
        document.getElementById('claimForm').reset();
        setDefaultDate();
        successEl.style.display = 'flex';
        setTimeout(() => { successEl.style.display = 'none'; }, 4000);
      } catch {
        showFormAlert('Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Claim';
      }
    });

    function showFormAlert(msg) {
      const el = document.getElementById('submitAlert');
      el.className = 'alert alert-error';
      el.textContent = '⚠ ' + msg;
      el.style.display = 'flex';
    }

    // ── Load claims ─────────────────────────────────────────
    let allClaims = [];

    async function loadClaims() {
      document.getElementById('claimsList').innerHTML =
        '<div class="loading-text"><span class="spinner"></span></div>';
      try {
        const res = await fetch('/api/claims');
        const data = await res.json();
        allClaims = data.claims || [];
        renderClaims();
      } catch {
        document.getElementById('claimsList').innerHTML =
          '<div class="alert alert-error">Failed to load claims.</div>';
      }
    }

    document.getElementById('statusFilter').addEventListener('change', renderClaims);

    function renderClaims() {
      const filter = document.getElementById('statusFilter').value;
      let claims = allClaims;
      if (filter) claims = claims.filter(c => c.status === filter);

      const el = document.getElementById('claimsList');
      if (claims.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>${filter ? 'No ' + filter + ' claims.' : 'You haven\'t submitted any claims yet.'}</p>
          </div>`;
        return;
      }

      el.innerHTML = `<div class="claim-list">${claims.map(claimCardHTML).join('')}</div>`;
    }

    function claimCardHTML(c) {
      const statusBadge = badgeHTML(c.status);
      const categoryChip = categoryHTML(c.category);
      const notesHTML = c.notes
        ? `<div class="claim-notes">📝 ${escapeHTML(c.notes)}</div>` : '';
      const commentHTML = c.admin_comment
        ? `<div class="claim-comment ${c.status}-comment">
             ${c.status === 'approved' ? '✓' : '✗'} Admin note: ${escapeHTML(c.admin_comment)}
           </div>` : '';

      return `
        <div class="claim-card ${c.status}">
          <div class="claim-header">
            <div class="claim-description">${escapeHTML(c.description)}</div>
            <div class="claim-amount">$${parseFloat(c.amount).toFixed(2)}</div>
          </div>
          <div class="claim-meta">
            ${statusBadge}
            <span class="dot">•</span>
            ${categoryChip}
            <span class="dot">•</span>
            <span>${formatDate(c.claim_date)}</span>
            <span class="dot">•</span>
            <span>Submitted ${formatDateTime(c.created_at)}</span>
          </div>
          ${notesHTML}
          ${commentHTML}
        </div>`;
    }
  </script>
</body>
</html>
